<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMCG AI Sales Assistant</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <h1>FMCG Sales Assistant</h1>
      <p class="subtitle">Ask me anything about FMCG sales data</p>
    </header>

    <!-- Message List -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        <div class="message-bubble">
          Hello! I can answer questions about FMCG sales data — tables, columns, sales figures, inventory, and more. What would you like to know?
        </div>
      </div>
    </div>

    <!-- Input Bar -->
    <form class="chat-input-bar" id="chatForm">
      <input
        type="text"
        id="chatInput"
        placeholder="Type your question…"
        autocomplete="off"
        maxlength="2000"
      />
      <button type="submit" id="sendBtn" title="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="/js/chat.js"></script>
</body>
</html>
